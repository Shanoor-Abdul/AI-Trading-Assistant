name: Fix readiness type contracts

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-readiness-types.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align readiness and risk types
        shell: python
        run: |
          from pathlib import Path

          schema = Path('src/lib/ai/schema.ts')
          text = schema.read_text()
          marker = '  strategyConflicts: z.any().optional(),\n'
          if marker in text and '  analysisId: z.string().optional(),' not in text:
              text = text.replace(marker, marker + '  analysisId: z.string().optional(),\n', 1)
          schema.write_text(text)

          normalize = Path('src/lib/ai/normalizeResponse.ts')
          text = normalize.read_text()
          marker = '      confidence: 0,\n      recommendedTimeframe: "",\n'
          if marker not in text:
              marker = '      confidence: 0,\n      recommendedTimeframe: "",\n'
          text = text.replace(marker, '      confidence: 0,\n      readiness: "NOT READY",\n      estimatedConfidence: "LOW",\n      recommendedTimeframe: "",\n', 1)
          normalize.write_text(text)

          risk = Path('src/lib/engines/RiskEngine.ts')
          text = risk.read_text()
          text = text.replace(
              '  static validate(\n    analysis: TradingAnalysis, \n    config: RiskConfig,\n    account: AccountState,\n    platform?: string\n  ): TradingAnalysis {',
              '  static validate<T extends TradingAnalysis>(\n    analysis: T,\n    config: RiskConfig,\n    account: AccountState,\n    platform?: string\n  ): T {',
              1,
          )
          risk.write_text(text)

          page = Path('src/app/page.tsx')
          text = page.read_text()
          text = text.replace(
              '                readiness: data.readiness,\n                estimatedConfidence: data.estimatedConfidence,',
              '                aiReadiness: data.readiness,\n                aiEstimatedConfidence: data.estimatedConfidence,',
              1,
          )
          page.write_text(text)

      - name: Commit and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/ai/schema.ts src/lib/ai/normalizeResponse.ts src/lib/engines/RiskEngine.ts src/app/page.tsx
          git rm .github/workflows/fix-readiness-types.yml
          git commit -m "fix: align AI readiness types" || exit 0
          git push origin HEAD:main

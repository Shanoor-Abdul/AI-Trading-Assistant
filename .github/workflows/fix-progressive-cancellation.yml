name: Fix progressive observation cancellation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-progressive-cancellation.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove per-frame cancellation
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('src/app/page.tsx')
          text = path.read_text()

          start = text.index('  // Progressive Analysis Loop\n  // One coordinator owns the queue.')
          end = text.index('  const handleAnalyzeSnapshot = async () => {', start)
          block = text[start:end]

          block = block.replace('    let cancelled = false;\n\n', '')
          block = block.replace('        while (!cancelled) {', '        while (true) {')
          block = re.sub(r'\n    return \(\) => \{\n      cancelled = true;\n    \};\n', '\n', block, count=1)

          text = text[:start] + block + text[end:]
          path.write_text(text)
          print('fixed progressive cancellation')

      - name: Commit and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/page.tsx
          git rm .github/workflows/fix-progressive-cancellation.yml
          git commit -m "fix: keep progressive observation coordinator alive" || exit 0
          git push origin HEAD:main

name: One-time mobile route typecheck fix

on:
  push:
    branches:
      - feature/web-mobile-v2

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, 'fix: mobile route typecheck')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/web-mobile-v2
          fetch-depth: 0

      - name: Fix object property narrowing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/app/api/mobile-analyze/route.ts')
          s = p.read_text()
          s = s.replace('source: emaValue.source === "api" || emaValue.source === "hybrid" ? emaValue.source : "visual",', 'source: (emaValue as Record<string, any>).source === "api" || (emaValue as Record<string, any>).source === "hybrid" ? (emaValue as Record<string, any>).source : "visual",')
          s = s.replace('source: value.source === "api" || value.source === "hybrid" ? value.source : "visual",', 'source: (value as Record<string, any>).source === "api" || (value as Record<string, any>).source === "hybrid" ? (value as Record<string, any>).source : "visual",')
          p.write_text(s)
          PY

      - name: Verify fix is present
        run: |
          grep -n "source: (emaValue as Record" src/app/api/mobile-analyze/route.ts
          grep -n "source: (value as Record" src/app/api/mobile-analyze/route.ts

      - name: Commit and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/api/mobile-analyze/route.ts .github/workflows/fix-mobile-route-type.yml
          git commit -m "fix: mobile route typecheck"
          git push origin feature/web-mobile-v2

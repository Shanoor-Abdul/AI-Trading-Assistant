name: Restore and fix page

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-and-fix-page.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore page from known-good parent and fix readiness fields
        shell: bash
        run: |
          set -e
          git fetch origin 7f17e151ce15e03e6648fad84100d9c599762b40 --depth=1
          git checkout 7f17e151ce15e03e6648fad84100d9c599762b40 -- src/app/page.tsx
          python - <<'PY'
          from pathlib import Path
          path = Path('src/app/page.tsx')
          text = path.read_text()
          old = 'readiness: data.readiness,\n          estimatedConfidence: data.estimatedConfidence'
          new = 'aiReadiness: data.readiness,\n          aiEstimatedConfidence: data.estimatedConfidence'
          if old not in text:
              raise SystemExit('Expected readiness update block was not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit restored page
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/page.tsx
          git rm .github/workflows/restore-and-fix-page.yml
          git commit -m "fix: restore dashboard page and readiness state update"
          git push origin HEAD:main

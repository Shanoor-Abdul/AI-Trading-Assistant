name: Validate main build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-main-build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Remove validation workflow
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/validate-main-build.yml
          git commit -m "chore: remove one-shot main build validation"
          git push origin HEAD:main

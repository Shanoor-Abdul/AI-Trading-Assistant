<!DOCTYPE html>
<html>
<head>
  <style>
    body { font-family: system-ui, sans-serif; width: 320px; padding: 16px; margin: 0; background: #09090b; color: #fff; }
    h2 { margin-top: 0; font-size: 16px; border-bottom: 1px solid #333; padding-bottom: 8px; }
    label { display: block; margin-top: 10px; font-size: 12px; color: #a1a1aa; }
    select, input, button { width: 100%; padding: 8px; margin-top: 4px; background: #18181b; border: 1px solid #3f3f46; color: white; border-radius: 4px; }
    button { background: #3b82f6; cursor: pointer; font-weight: bold; margin-top: 16px; border: none; }
    button:hover { background: #2563eb; }
    #result { margin-top: 16px; padding: 12px; background: #18181b; border-radius: 6px; display: none; font-size: 13px; }
    .signal { font-size: 18px; font-weight: bold; margin-bottom: 8px; }
    .buy { color: #22c55e; }
    .sell { color: #ef4444; }
    .wait { color: #eab308; }
  </style>
</head>
<body>
  <h2>AI Trading Assistant</h2>
  
  <label>Asset Symbol</label>
  <input type="text" id="symbol" value="AUD/CAD OTC" />

  <label>Timeframe</label>
  <select id="timeframe">
    <option value="1m">1 Minute</option>
    <option value="5m" selected>5 Minutes</option>
    <option value="15m">15 Minutes</option>
  </select>

  <label>AI Model</label>
  <select id="model">
    <option value="anthropic/claude-3-haiku">Claude 3 Haiku (Fast)</option>
    <option value="anthropic/claude-3-5-sonnet">Claude 3.5 Sonnet (Smart)</option>
    <option value="openai/gpt-4o-mini">GPT-4o Mini</option>
  </select>

  <button id="analyzeBtn">Analyze & Auto-Trade</button>

  <div id="result">
    <div id="signalText" class="signal"></div>
    <div id="reasoningText"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
